<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura-X | Careers</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .story-container > *, .card > *, .audience-box, .leader-profile, .roadmap-item {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .story-container > *.visible, .card > *.visible, .audience-box.visible, .leader-profile.visible, .roadmap-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="Aura-X Logo" class="brand-logo">
            <span class="logo-text">Aura-X</span>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <ul id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="leadership.html">Leadership</a></li>
                <li><a href="updates.html">Updates</a></li>
                <li><a href="support.html">Help Center</a></li>
                <li><a href="careers.html" class="active">Careers</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <section class="card">
            <h2>Careers at Aura-X</h2>
            <div style="background: rgba(0, 0, 0, 0.25); border: 1px dashed #f472b6; padding: 30px; border-radius: 12px; text-align: center; margin-top: 15px;">
                <h3 style="color: #f472b6; margin-bottom: 10px; font-size: 1.3rem;">Opening Soon!</h3>
                <p style="color: #e2e8f0; margin: 0;">We are currently building our core team and platform roadmap. Check back soon for open job listings and career opportunities at Aura-X.</p>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Aura-X. All rights reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('show');
        }

        document.addEventListener("DOMContentLoaded", function() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.story-container > *, .card > *, .audience-box, .leader-profile, .roadmap-item').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
